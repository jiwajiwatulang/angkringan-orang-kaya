name: Build Android APK & AAB (Disabled / Manual Only)

on:
  workflow_dispatch:

jobs:
  build:
    if: false # Dinonaktifkan sementara sesuai instruksi Owner (jangan jalan otomatis dulu)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install dependencies
      run: npm install

    - name: Build Web App (Next.js)
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Grant execute permission for gradlew
      working-directory: ./android
      run: chmod +x gradlew

    - name: Build APK & Bundle AAB
      working-directory: ./android
      run: |
        ./gradlew assembleDebug
        ./gradlew bundleDebug

    - name: Upload APK (For Testing)
      uses: actions/upload-artifact@v4
      with:
        name: pos-cashier-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload AAB (For Google Play Store)
      uses: actions/upload-artifact@v4
      with:
        name: pos-cashier-aab
        path: android/app/build/outputs/bundle/debug/app-debug.aab
